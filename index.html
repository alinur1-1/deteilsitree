    // ============================================================================
    const formatKzPhone = (raw) => {
      let digits = String(raw || '').replace(/\D/g, '');
      if (!digits) return '+7 ';
      if (digits.startsWith('8')) digits = '7' + digits.slice(1);
      if (!digits.startsWith('7')) digits = '7' + digits;
      digits = digits.slice(0, 11);

      let out = '+7';
      if (digits.length > 1) out += ' (' + digits.slice(1, 4);
      if (digits.length >= 4) out += ') ' + digits.slice(4, 7);
      if (digits.length >= 7) out += '-' + digits.slice(7, 9);
      if (digits.length >= 9) out += '-' + digits.slice(9, 11);
      return out;
    };

    const validateKzPhone = (phoneStr) => {
      const digits = String(phoneStr || '').replace(/\D/g, '');
      if (digits.length < 11) {
        return {
          valid: false,
          message: `Введите ещё ${11 - digits.length} цифр(ы) номера`
        };
      }
      const code = digits.slice(1, 4);
      const validCodes = ['700','701','702','705','706','707','708','747','771','775','776','777','778'];
      if (!validCodes.includes(code)) {
        return {
          valid: false,
          message: `Неверный код оператора (${code}). Укажите 701, 707, 777, 747 и т.д.`
        };
      }
      return { valid: true, digits, message: 'Номер телефона проверен ✓' };
    };

      if (h > 0 && mins > 0) return `${h} ч ${mins} мин`;
      if (h > 0) return `${h} ${h === 1 ? 'час' : h < 5 ? 'часа' : 'часов'}`;
      return `${mins} мин`;
    };
    const toMinutes = (t) => {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    };
    const toTimeStr = (mins) => {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    };

      const list = [];
      const wNames = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        const d = new Date();
        d.setDate(d.getDate() + i);
        const iso = d.toISOString().split('T')[0];
        list.push({
          iso,
          dayNum: d.getDate(),
          weekDay: i === 0 ? 'Сегодня' : i === 1 ? 'Завтра' : wNames[d.getDay()]
        });
      }
      return list;
    };

      const [manualPrice, setManualPrice] = useState('15000');

      const categories = useMemo(() => {
        const cats = new Set(currentStudio.services.map(s => s.category));
        return ['Все', ...Array.from(cats)];
      }, [currentStudio]);

      const filteredServices = useMemo(() => {
        if (activeCategory === 'Все') return currentStudio.services;
        return currentStudio.services.filter(s => s.category === activeCategory);
      }, [currentStudio, activeCategory]);

      const totalDuration = useMemo(() => {
        return selectedServices.reduce((acc, id) => {
          const item = currentStudio.services.find(s => s.id === id);
          return acc + (item ? item.duration : 0);
        }, 0) || 60;
      }, [selectedServices, currentStudio]);

      const totalPrice = useMemo(() => {
        return selectedServices.reduce((acc, id) => {
          const item = currentStudio.services.find(s => s.id === id);
          return acc + (item ? item.price : 0);
        }, 0);
      }, [selectedServices, currentStudio]);

      const toggleService = (id) => {
        setConfirmedTicket(null);
        setSelectedTime('');
        setSelectedServices(prev =>
          prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
        );
      };

      // Проверка занятости боксов (защита от овербукинга)
      const checkSlotAvailability = (dateIso, startTimeStr, durationMins) => {
        const startMin = toMinutes(startTimeStr);
        const endMin = startMin + durationMins;
        const closeMin = currentStudio.workHours.end * 60;

        if (endMin > closeMin) return { available: false, freeBox: null };

        const dayBookings = bookings.filter(
          b => b.studioSlug === currentStudio.slug && b.date === dateIso && b.status !== 'Отменена'
        );

        for (let box = 1; box <= currentStudio.boxesCount; box++) {
          const boxBookings = dayBookings.filter(b => b.boxNumber === box);
          const overlap = boxBookings.some(b => {
            const bStart = toMinutes(b.startTime);
            const bEnd = toMinutes(b.endTime);
            return startMin < bEnd && endMin > bStart;
          });
          if (!overlap) return { available: true, freeBox: box };
        }
        return { available: false, freeBox: null };
      };

      const timeSlots = useMemo(() => {
        const list = [];
        for (let h = currentStudio.workHours.start; h < currentStudio.workHours.end; h++) {
          for (let m of [0, 30]) {
            const tStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            const st = checkSlotAvailability(selectedDate, tStr, totalDuration);
            list.push({ time: tStr, ...st });
          }
        }
        return list;
      }, [currentStudio, selectedDate, totalDuration, bookings]);

      // Отправка заявки с проверкой телефона
      const handleBookingSubmit = (e) => {
        e.preventDefault();
        setPhoneTouched(true);
        if (!phoneCheck.valid) return;
        if (selectedServices.length === 0 || !selectedTime || !clientName.trim()) return;

        const check = checkSlotAvailability(selectedDate, selectedTime, totalDuration);
        if (!check.available) {
          alert('Извините, этот слот только что заняли. Выберите другое время.');
          return;
        }

        const chosenTitles = selectedServices.map(id => {
          const s = currentStudio.services.find(x => x.id === id);
          return s ? s.title : '';
        }).filter(Boolean);

        const nowStr = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const endTimeStr = toTimeStr(toMinutes(selectedTime) + totalDuration);
        const ticket = {
          id: 'RED-' + Math.floor(1000 + Math.random() * 9000),
          studioSlug: currentStudio.slug,
          studioName: currentStudio.name,
          clientName: clientName.trim(),
          clientPhone: clientPhone.trim(),
          carModel: carModel.trim() || 'Автомобиль клиента',
          serviceTitles: chosenTitles,
          date: selectedDate,
          startTime: selectedTime,
          endTime: endTimeStr,
          duration: totalDuration,
          totalPrice,
          boxNumber: check.freeBox,
          source: 'Сайт',
          status: 'Новая',
          createdAt: `Сегодня, ${nowStr}`
        };

        setBookings(prev => [ticket, ...prev]);
        setConfirmedTicket(ticket);
        sendLeadToExternal(ticket);
      };

      // Добавление фото работы по ссылке
      const handleAddGalleryPhoto = (e) => {
        e.preventDefault();
        if (!newPhotoUrl.trim()) return;
        const item = {
          id: 'ph_' + Date.now(),
          url: newPhotoUrl.trim(),
          car: newPhotoCar.trim() || 'Премиальный автомобиль',
          work: newPhotoDesc.trim() || 'Комплексный детейлинг и защита кузова'
        };
        setStudios(prev => prev.map(st => {
          if (st.slug !== currentStudio.slug) return st;
          return { ...st, gallery: [item, ...st.gallery] };
        }));
        setNewPhotoUrl('');
        setNewPhotoCar('');
        setNewPhotoDesc('');
        setShowAddPhotoModal(false);
      };

      // Смена логотипа в 1 клик
      const handleQuickLogoChange = () => {
        const url = prompt('Вставьте прямую ссылку (URL) на новый логотип салона:', currentStudio.logoUrl);
        if (url && url.trim()) {
          setStudios(prev => prev.map(st => st.slug === currentStudio.slug ? { ...st, logoUrl: url.trim() } : st));
        }
      };

      const copyShareLink = (slugToCopy = currentStudio.slug) => {
        const url = new URL(window.location.href);
        url.searchParams.delete('crm');
        url.searchParams.set('v', slugToCopy);
        navigator.clipboard.writeText(url.toString());
        setCopiedLink(true);
        setTimeout(() => setCopiedLink(false), 2000);
      };

      // Ручное создание заявки в CRM
      const handleManualAdd = (e) => {
        e.preventDefault();
        const checkPhone = validateKzPhone(manualPhone);
        if (!checkPhone.valid) {
          alert(checkPhone.message);
          return;
        }
        const nowStr = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const ticket = {
          id: 'CRM-' + Math.floor(1000 + Math.random() * 9000),
          studioSlug: currentStudio.slug,
          studioName: currentStudio.name,
          clientName: manualName.trim() || 'Клиент по звонку',
          clientPhone: manualPhone,
          carModel: manualCar.trim() || 'Авто клиента',
          serviceTitles: ['Ручная запись администратором'],
          date: todayIso,
          startTime: manualTime,
          endTime: toTimeStr(toMinutes(manualTime) + 60),
          duration: 60,
          totalPrice: Number(manualPrice) || 15000,
          boxNumber: 1,
          source: 'Звонок / CRM',
          status: 'В работе',
          createdAt: `Сегодня, ${nowStr}`
        };
        setBookings(prev => [ticket, ...prev]);
        setShowManualModal(false);
        setManualName('');
        setManualPhone('+7 ');
        setManualCar('');
      };

      // ИИ-Ассистент
      const [chatMessages, setChatMessages] = useState([
        {
          role: 'ai',
          text: `Здравствуйте! Я AI-консьерж студии «${currentStudio.name}». Напишите, какую услугу и на какое время вы хотите записать авто — я проверю свободные боксы и создам бронь.`
        }
      ]);
      const [chatInput, setChatInput] = useState('');

      useEffect(() => {
        setChatMessages([
          {
            role: 'ai',
            text: `Здравствуйте! Я AI-консьерж студии «${currentStudio.name}». Напишите, какую услугу и на какое время вы хотите записать авто — я проверю свободные боксы и создам бронь.`
          }
        ]);
      }, [currentStudio.slug]);

      const handleSendChat = (customText) => {
        const q = (customText || chatInput).trim();
        if (!q) return;
        const userMsg = { role: 'user', text: q };
        setChatInput('');

        const lower = q.toLowerCase();
        const isTomorrow = lower.includes('завтра');
        const targetDate = isTomorrow ? days[1].iso : todayIso;
        const dateLabel = isTomorrow ? 'завтра' : 'сегодня';

        let matchedService = currentStudio.services[0];
        for (const s of currentStudio.services) {
          if (
            (lower.includes('полир') && s.category === 'Полировка') ||
            (lower.includes('химч') && s.category === 'Химчистка') ||
            (lower.includes('пленк') && s.category === 'Бронепленка') ||
            (lower.includes('мойк') && s.category === 'Мойка')
          ) {
            matchedService = s;
            break;
          }
        }

        let preferredHour = 14;
        const timeMatch = lower.match(/(\d{1,2})[:\s]?(\d{2})?/);
        if (timeMatch) {
          let h = parseInt(timeMatch[1], 10);
          if (h >= 1 && h <= 7 && (lower.includes('вечер') || lower.includes('после'))) h += 12;
          if (h >= 8 && h <= 20) preferredHour = h;
        } else if (lower.includes('вечер')) preferredHour = 18;
        else if (lower.includes('утр')) preferredHour = 10;

        let chosenSlot = null;
        for (let h = preferredHour; h < currentStudio.workHours.end; h++) {
          for (let m of [0, 30]) {
            const candidate = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            const check = checkSlotAvailability(targetDate, candidate, matchedService.duration);
            if (check.available) {
              chosenSlot = { time: candidate, box: check.freeBox };
              break;
            }
          }
          if (chosenSlot) break;
        }

        let aiReply;
        if (chosenSlot) {
          aiReply = {
            role: 'ai',
            text: `Проверил боксы на ${dateLabel}. Могу записать вас на «${matchedService.title}» (${formatDuration(matchedService.duration)}, ${formatPrice(matchedService.price)}) в ${chosenSlot.time}, свободен Бокс №${chosenSlot.box}. Оформляем?`,
            proposal: {
              service: matchedService,
              date: targetDate,
              dateLabel,
              time: chosenSlot.time,
              box: chosenSlot.box
            }
          };
        } else {
          aiReply = {
            role: 'ai',
            text: `На ${dateLabel} после ${preferredHour}:00 все боксы заняты. Попробуем выбрать утреннее время?`
          };
        }
        setChatMessages(prev => [...prev, userMsg, aiReply]);
      };

      const confirmAiProposal = (proposal) => {
        const nowStr = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const endTimeStr = toTimeStr(toMinutes(proposal.time) + proposal.service.duration);
        const ticket = {
          id: 'AI-' + Math.floor(1000 + Math.random() * 9000),
          studioSlug: currentStudio.slug,
          studioName: currentStudio.name,
          clientName: clientName.trim() || 'Клиент из AI-чата',
          clientPhone: phoneCheck.valid ? clientPhone : '+7 (701) 000-00-00',
          carModel: carModel.trim() || 'Автомобиль клиента',
          serviceTitles: [proposal.service.title],
          date: proposal.date,
          startTime: proposal.time,
          endTime: endTimeStr,
          duration: proposal.service.duration,
          totalPrice: proposal.service.price,
          boxNumber: proposal.box,
          source: 'AI-Консьерж',
          status: 'Новая',
          createdAt: `Сегодня, ${nowStr}`
        };
        setBookings(prev => [ticket, ...prev]);
        setConfirmedTicket(ticket);
        sendLeadToExternal(ticket);
        setChatMessages(prev => [
          ...prev,
          {
            role: 'ai',
            text: `Бронь #${ticket.id} подтверждена и отправлена в CRM! Ждем вас ${proposal.dateLabel} в ${proposal.time} (Бокс №${proposal.box}).`
          }
        ]);
      };

      // Отфильтрованные заявки для CRM
      const crmLeads = useMemo(() => {
        return bookings.filter(b => {
          const matchStudio = crmStudioFilter === 'all' || b.studioSlug === crmStudioFilter;
          const matchStatus = crmStatusFilter === 'Все' || b.status === crmStatusFilter;
          const q = crmSearch.toLowerCase().trim();
          const matchQuery =
            !q ||
            b.clientName.toLowerCase().includes(q) ||
            b.clientPhone.toLowerCase().includes(q) ||
            b.carModel.toLowerCase().includes(q) ||
            b.id.toLowerCase().includes(q);
          return matchStudio && matchStatus && matchQuery;
        });
      }, [bookings, crmStudioFilter, crmStatusFilter, crmSearch]);

      const crmStats = useMemo(() => {
        const activeList = bookings.filter(b => b.status !== 'Отменена');
        const revenue = activeList.reduce((acc, x) => acc + (x.totalPrice || 0), 0);
        const newCount = bookings.filter(b => b.status === 'Новая').length;
        return { total: bookings.length, newCount, revenue };
      }, [bookings]);

      return (
        <div className="min-h-screen text-white pb-28 relative overflow-x-hidden">
          {/* КОСМИЧЕСКОЕ КРАСНОЕ СВЕЧЕНИЕ ВВЕРХУ ЭКРАНА */}
          <div
            className="pointer-events-none fixed inset-x-0 top-0 h-[480px] z-0"
            style={{
              background: 'radial-gradient(60% 50% at 50% 0%, rgba(255, 30, 56, 0.22), rgba(3, 3, 5, 0))'
            }}
          />

          {/* ВЕРХНЯЯ НАВИГАЦИЯ */}
          <header className="sticky top-0 z-40 backdrop-blur-2xl bg-[#030305]/85 border-b border-white/10">
            <div className="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between gap-2">
              <div className="flex items-center gap-3 min-w-0">
                <button
                  onClick={handleQuickLogoChange}
                  title="Нажмите, чтобы поменять логотип по ссылке"
                  className="relative group w-11 h-11 rounded-2xl overflow-hidden border border-[#FF1E38]/50 bg-black shrink-0"
                >
                  <img src={currentStudio.logoUrl} alt={currentStudio.name} className="w-full h-full object-cover" />
                  <span className="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 flex items-center justify-center text-[9px] text-white font-semibold transition">
                    ЛОГО
                  </span>
                </button>
                <div className="min-w-0">
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-sm sm:text-base tracking-tight text-white truncate">
                      {currentStudio.name}
                    </span>
                    <span className="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-[#FF1E38]/15 text-[#FF4D64] border border-[#FF1E38]/40">
                      <span className="w-1.5 h-1.5 rounded-full bg-[#FF1E38] animate-ping" />
                      ONLINE
                    </span>
                  </div>
                  <p className="text-xs text-white/70 truncate">{currentStudio.address}</p>
                </div>
              </div>

              {/* Переключатели: Реестр салонов (?v=) и Страница CRM (?crm=1) */}
              <div className="flex items-center gap-2 shrink-0">
                <button
                  onClick={() => setShowRegistryModal(true)}
                  className="px-3 py-2 rounded-2xl text-xs font-semibold bg-white/[0.06] hover:bg-white/[0.12] border border-white/15 flex items-center gap-1.5 text-white transition"
                >
                  <Icon name="layers" className="w-3.5 h-3.5 text-[#FF1E38]" />
                  <span className="hidden sm:inline">Салоны</span>
                  <span className="text-[#FF4D64]">?v={currentStudio.slug}</span>
                </button>

                <button
                  onClick={() => copyShareLink()}
                  className="p-2 rounded-2xl bg-white/[0.06] hover:bg-white/[0.12] border border-white/15 text-white transition"
                  title="Скопировать ссылку на салон"
                >
                  <Icon name={copiedLink ? "check" : "share-2"} className="w-4 h-4 text-[#FF1E38]" />
                </button>

                <button
                  onClick={() => switchPageMode(pageMode === 'crm' ? 'studio' : 'crm')}
                  className={`px-3.5 py-2 rounded-2xl text-xs font-bold flex items-center gap-1.5 transition border ${
                    pageMode === 'crm'
                      ? 'bg-[#FF1E38] text-white border-[#FF1E38] crimson-glow'
                      : 'bg-white/[0.06] hover:bg-white/[0.12] text-white border-white/15'
                  }`}
                >
                  <Icon name="layout-dashboard" className="w-3.5 h-3.5" />
                  <span>{pageMode === 'crm' ? '← На витрину' : 'CRM-Центр'}</span>
                  {crmStats.newCount > 0 && (
                    <span className="px-1.5 py-0.2 rounded-full text-[10px] bg-white text-black font-extrabold">
                      {crmStats.newCount}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </header>

          {/* ====================================================================
              РЕЖИМ 1: ПОЛНОЦЕННАЯ СТРАНИЦА CRM ДЛЯ ПРИЕМА ЗАЯВОК (?crm=1)
             ==================================================================== */}
          {pageMode === 'crm' ? (
            <main className="relative z-10 max-w-6xl mx-auto px-4 pt-6 space-y-6">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-[#0A0A0F]/90 border border-white/15 rounded-[28px] p-6">
                <div>
                  <span className="text-xs font-bold uppercase tracking-[0.2em] text-[#FF1E38]">
                    COSMIC CRM • ЕДИНЫЙ ЦЕНТР ЗАЯВОК
                  </span>
                  <h1 className="text-2xl sm:text-3xl font-extrabold text-white mt-1">
                    Входящие бронирования и боксы
                  </h1>
                  <p className="text-xs sm:text-sm text-white/70 mt-1">
                    Сюда автоматически поступают все заявки с клиентских сайтов (?v=...) и из AI-консьержа
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-2.5">
                  <button
                    onClick={() => setShowManualModal(true)}
                    className="px-4 py-3 rounded-2xl text-xs font-bold bg-[#FF1E38] hover:bg-[#E11D48] text-white crimson-glow flex items-center gap-2 transition"
                  >
                    <Icon name="plus" className="w-4 h-4" />
                    <span>+ Записать вручную</span>
                  </button>
                  <button
                    onClick={() => setShowCrmSettings(!showCrmSettings)}
                    className="px-4 py-3 rounded-2xl text-xs font-semibold bg-white/[0.07] hover:bg-white/[0.12] border border-white/15 text-white flex items-center gap-2 transition"
                  >
                    <Icon name="send" className="w-4 h-4 text-[#FF1E38]" />
                    <span>Telegram / Webhook</span>
                  </button>
                </div>
              </div>

              {/* Настройки уведомлений в Telegram */}
              {showCrmSettings && (
                <div className="rounded-[26px] p-6 bg-[#0B0B10] border border-[#FF1E38]/40 space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                      <Icon name="bell" className="w-4 h-4 text-[#FF1E38]" />
                      <span>Мгновенная пересылка заявок в Telegram и внешнюю CRM</span>
                    </h3>
                    <button onClick={() => setShowCrmSettings(false)} className="text-xs text-white/60 hover:text-white">
                      Скрыть
                    </button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                      <label className="text-xs text-white/70 block mb-1">Telegram Bot Token</label>
                      <input
                        type="text"
                        placeholder="123456:ABC-DEF..."
                        value={crmConfig.tgBotToken}
                        onChange={e => setCrmConfig({ ...crmConfig, tgBotToken: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-white/15 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-white/70 block mb-1">Telegram Chat ID владельца</label>
                      <input
                        type="text"
                        placeholder="Например: 987654321"
                        value={crmConfig.tgChatId}
                        onChange={e => setCrmConfig({ ...crmConfig, tgChatId: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-white/15 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-white/70 block mb-1">Webhook URL (Make / n8n / AmoCRM)</label>
                      <input
                        type="url"
                        placeholder="https://hook.eu1.make.com/..."
                        value={crmConfig.webhookUrl}
                        onChange={e => setCrmConfig({ ...crmConfig, webhookUrl: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-white/15 text-xs text-white"
                      />
                    </div>
                  </div>
                </div>
              )}

              {/* Метрики CRM */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div className="p-5 rounded-[24px] bg-[#0A0A0F]/90 border border-white/10">
                  <span className="text-xs text-white/60">Всего заявок в базе</span>
                  <p className="text-3xl font-extrabold text-white mt-1">{crmStats.total}</p>
                </div>
                <div className="p-5 rounded-[24px] bg-[#0A0A0F]/90 border border-[#FF1E38]/40">
                  <span className="text-xs text-[#FF4D64] font-semibold">Новые (ждут подтверждения)</span>
                  <p className="text-3xl font-extrabold text-white mt-1">{crmStats.newCount}</p>
                </div>
                <div className="p-5 rounded-[24px] bg-[#0A0A0F]/90 border border-white/10">
                  <span className="text-xs text-white/60">Сумма активных записей</span>
                  <p className="text-3xl font-extrabold text-white mt-1">{formatPrice(crmStats.revenue)}</p>
                </div>
              </div>

              {/* Фильтры CRM */}
              <div className="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between bg-[#0A0A0F]/90 p-4 rounded-[24px] border border-white/10">
                <div className="flex flex-wrap items-center gap-2">
                  <select
                    value={crmStudioFilter}
                    onChange={e => setCrmStudioFilter(e.target.value)}
                    className="px-3.5 py-2 rounded-xl bg-black border border-white/15 text-xs font-semibold text-white"
                  >
                    <option value="all">Все салоны ({studios.length})</option>
                    {studios.map(s => (
                      <option key={s.slug} value={s.slug}>{s.name}</option>
                    ))}
                  </select>

                  {['Все', 'Новая', 'В работе', 'Завершена', 'Отменена'].map(st => (
                    <button
                      key={st}
                      onClick={() => setCrmStatusFilter(st)}
                      className={`px-3 py-2 rounded-xl text-xs font-semibold border transition ${
                        crmStatusFilter === st
                          ? 'bg-[#FF1E38] text-white border-[#FF1E38]'
                          : 'bg-black/60 text-white/75 border-white/10 hover:border-white/30'
                      }`}
                    >
                      {st}
                    </button>
                  ))}
                </div>

                <input
                  type="text"
                  placeholder="Поиск по имени, телефону или авто..."
                  value={crmSearch}
                  onChange={e => setCrmSearch(e.target.value)}
                  className="px-4 py-2 rounded-xl bg-black border border-white/15 text-xs text-white placeholder-white/40 md:w-64"
                />
              </div>

              {/* Список карточек заявок */}
              <div className="space-y-3">
                {crmLeads.length === 0 ? (
                  <div className="p-12 text-center rounded-[28px] bg-[#0A0A0F]/70 border border-white/10 text-white/60 text-sm">
                    Заявок по выбранному фильтру пока нет.

          )}

          {/* МОБИЛЬНЫЙ ДОК СНИЗУ */}
          <div className="fixed bottom-4 inset-x-4 z-30 sm:hidden">
            <div className="rounded-3xl p-2 bg-[#0A0A0F]/95 backdrop-blur-2xl border border-white/20 shadow-2xl flex items-center justify-between gap-2">
              <button
                onClick={() => {
                  if (pageMode === 'crm') switchPageMode('studio');
                  setTimeout(() => {
                    const el = document.getElementById('booking-section');
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                  }, 50);
                }}
                className="flex-1 py-3 px-4 rounded-2xl text-xs font-extrabold text-center bg-[#FF1E38] text-white crimson-glow"
              >
                {selectedServices.length > 0 ? `Записаться • ${formatPrice(totalPrice)}` : 'Онлайн-запись'}
              </button>
              <button
                onClick={() => setShowChatModal(true)}
                className="py-3 px-3.5 rounded-2xl text-xs font-bold bg-white/10 text-white border border-white/15"
              >
                AI-Чат
              </button>
              <button
                onClick={() => switchPageMode(pageMode === 'crm' ? 'studio' : 'crm')}
                className="py-3 px-3.5 rounded-2xl text-xs font-bold bg-white/10 text-[#FF4D64] border border-white/15"
              >
                CRM ({crmStats.newCount})
              </button>
            </div>
          </div>

          {/* МОДАЛКА РЕЕСТРА САЛОНОВ (?v=slug) */}
          {showRegistryModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#0A0A0F] border border-white/20 rounded-[30px] max-w-lg w-full p-6 space-y-5">
                <div className="flex items-center justify-between">
                  <div>
                    <span className="text-[11px] font-bold uppercase tracking-widest text-[#FF1E38]">РЕЕСТР САЛОНОВ</span>
                    <h3 className="text-xl font-extrabold text-white">Переключение по ?v=</h3>
                  </div>
                  <button onClick={() => setShowRegistryModal(false)} className="p-2 rounded-full bg-white/10">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-2.5 max-h-80 overflow-y-auto">
                  {studios.map(st => (
                    <div
                      key={st.slug}
                      className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 ${
                        st.slug === currentStudio.slug ? 'bg-[#FF1E38]/15 border-[#FF1E38]' : 'bg-black border-white/15'
                      }`}
                    >
                      <div
                        onClick={() => {
                          switchStudio(st.slug);
                          setShowRegistryModal(false);
                        }}
                        className="flex items-center gap-3 cursor-pointer flex-1 min-w-0"
                      >
                        <img src={st.logoUrl} alt={st.name} className="w-10 h-10 rounded-xl object-cover shrink-0" />
                        <div className="min-w-0">
                          <p className="text-sm font-bold text-white truncate">{st.name}</p>
                          <p className="text-[11px] text-white/70 truncate">?v={st.slug} • {st.address}</p>
                        </div>
                      </div>
                      <button
                        onClick={() => copyShareLink(st.slug)}
                        className="px-3 py-1.5 rounded-xl text-xs font-bold bg-[#FF1E38] text-white"
                      >
                        Ссылка
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* МОДАЛКА РУЧНОЙ ЗАПИСИ В CRM */}
          {showManualModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <form
                onSubmit={handleManualAdd}
                className="bg-[#0A0A0F] border border-white/20 rounded-[30px] max-w-md w-full p-6 space-y-4"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-white">Добавить запись вручную</h3>
                  <button type="button" onClick={() => setShowManualModal(false)} className="p-2 rounded-full bg-white/10">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                <input
                  type="text"
                  required
                  placeholder="Имя клиента"
                  value={manualName}
                  onChange={e => setManualName(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-white/20 text-sm text-white"
                />
                <input
                  type="tel"
                  required
                  placeholder="+7 (701) 000-00-00"
                  value={manualPhone}
                  onChange={e => setManualPhone(formatKzPhone(e.target.value))}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-white/20 text-sm text-white"
                />
                <input
                  type="text"
                  placeholder="Автомобиль и госномер"
                  value={manualCar}
                  onChange={e => setManualCar(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-white/20 text-sm text-white"
                />
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="time"
                    value={manualTime}
                    onChange={e => setManualTime(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-white/20 text-sm text-white"
                  />
                  <input
                    type="number"
                    placeholder="Сумма (₸)"
                    value={manualPrice}
                    onChange={e => setManualPrice(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-white/20 text-sm text-white"
                  />
                </div>
                <button type="submit" className="w-full py-3.5 rounded-2xl text-sm font-bold bg-[#FF1E38] text-white crimson-glow">
                  Сохранить и заблокировать бокс
                </button>
              </form>
            </div>
          )}

          {/* МОДАЛКА ДОБАВЛЕНИЯ ФОТО РАБОТЫ ПО ССЫЛКЕ */}
          {showAddPhotoModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <form
                onSubmit={handleAddGalleryPhoto}
                className="bg-[#0A0A0F] border border-white/20 rounded-[30px] max-w-md w-full p-6 space-y-4"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-white">Добавить фото работы по ссылке</h3>
                  <button type="button" onClick={() => setShowAddPhotoModal(false)} className="p-2 rounded-full bg-white/10">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                <input
                  type="url"
                  required
                  placeholder="Прямая ссылка на фото (https://...)"
                  value={newPhotoUrl}
                  onChange={e => setNewPhotoUrl(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-white/20 text-sm text-white"
                />
                <input
                  type="text"
                  placeholder="Марка и модель авто (например, Porsche 911)"
                  value={newPhotoCar}
                  onChange={e => setNewPhotoCar(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-white/20 text-sm text-white"
                />
                <input
                  type="text"
                  placeholder="Описание выполненной работы"
                  value={newPhotoDesc}
                  onChange={e => setNewPhotoDesc(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-black border border-white/20 text-sm text-white"
                />
                <button type="submit" className="w-full py-3.5 rounded-2xl text-sm font-bold bg-[#FF1E38] text-white crimson-glow">
                  Опубликовать в портфолио
                </button>
              </form>
            </div>
          )}

          {/* ПРОСМОТР ФОТО */}
          {lightboxPhoto && (
            <div
              onClick={() => setLightboxPhoto(null)}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-xl flex items-center justify-center p-4"
            >
              <div className="max-w-2xl w-full bg-[#0A0A0F] border border-white/20 rounded-3xl overflow-hidden">
                <img src={lightboxPhoto.url} alt={lightboxPhoto.car} className="w-full max-h-[70vh] object-cover" />
                <div className="p-5 flex items-center justify-between">
                  <div>
                    <h4 className="text-lg font-extrabold text-white">{lightboxPhoto.car}</h4>
                    <p className="text-sm text-white/80">{lightboxPhoto.work}</p>
                  </div>
                  <button onClick={() => setLightboxPhoto(null)} className="px-4 py-2 rounded-xl bg-white/10 text-xs font-bold">
                    Закрыть
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* МОДАЛКА AI-АССИСТЕНТА */}
          {showChatModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-[#0A0A0F] border border-white/20 rounded-t-[30px] sm:rounded-[30px] max-w-md w-full h-[82vh] sm:h-[600px] flex flex-col overflow-hidden">
                <div className="p-4 border-b border-white/15 flex items-center justify-between bg-black">
                  <div className="flex items-center gap-2.5">
                    <div className="w-9 h-9 rounded-2xl bg-[#FF1E38]/20 border border-[#FF1E38] flex items-center justify-center text-[#FF1E38]">
                      <Icon name="sparkles" className="w-4 h-4" />
                    </div>
                    <div>
                      <h4 className="text-sm font-extrabold text-white">AI-Администратор • {currentStudio.name}</h4>
                      <p className="text-[11px] text-[#FF4D64]">Прямая запись в CRM</p>
                    </div>
                  </div>
                  <button onClick={() => setShowChatModal(false)} className="p-2 rounded-full bg-white/10">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-3">
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} className={`flex flex-col ${msg.role === 'user' ? 'items-end' : 'items-start'}`}>
                      <div
                        className={`max-w-[85%] rounded-2xl px-4 py-3 text-xs sm:text-sm leading-relaxed ${
                          msg.role === 'user'
                            ? 'bg-[#FF1E38] text-white font-bold'
                            : 'bg-black border border-white/15 text-white'
                        }`}
                      >
                        {msg.text}
                      </div>

                      {msg.proposal && (
                        <div className="mt-2 w-[85%] p-3.5 rounded-2xl bg-black border border-[#FF1E38] space-y-2">
                          <div className="flex justify-between text-xs">
                            <span className="text-white/70">Услуга:</span>
                            <span className="font-bold text-white">{msg.proposal.service.title}</span>
                          </div>
                          <div className="flex justify-between text-xs">
                            <span className="text-white/70">Слот:</span>
                            <span className="text-[#FF4D64] font-bold">
                              {msg.proposal.dateLabel}, {msg.proposal.time} (Бокс №{msg.proposal.box})
                            </span>
                          </div>
                          <button
                            onClick={() => confirmAiProposal(msg.proposal)}
                            className="w-full py-2.5 rounded-xl text-xs font-extrabold bg-[#FF1E38] text-white crimson-glow"
                          >
                            Записаться в 1 клик ({formatPrice(msg.proposal.service.price)})
                          </button>
                        </div>
                      )}
                    </div>
                  ))}
                </div>

                <div className="px-4 py-2 flex gap-1.5 overflow-x-auto no-scrollbar border-t border-white/10">
                  {['Хочу мойку сегодня в 16:00', 'Полировка завтра утром', 'Химчистка после 15:00'].map(chip => (
                    <button
                      key={chip}
                      onClick={() => handleSendChat(chip)}
                      className="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-white/10 hover:bg-white/20 text-white whitespace-nowrap"
                    >
                      {chip}
                    </button>
                  ))}
                </div>

                <div className="p-3 border-t border-white/15 flex gap-2 bg-black">
                  <input
                    type="text"
                    placeholder="Напишите: Хочу мойку завтра в 18:00..."
                    value={chatInput}
                    onChange={e => setChatInput(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && handleSendChat()}
                    className="flex-1 px-4 py-2.5 rounded-2xl bg-[#0A0A0F] border border-white/20 text-xs sm:text-sm text-white focus:outline-none"
                  />
                  <button onClick={() => handleSendChat()} className="px-4 rounded-2xl bg-[#FF1E38] text-white">
                    <Icon name="send" className="w-4 h-4" />
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
